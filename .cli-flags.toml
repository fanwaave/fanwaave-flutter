[help]
url = "https://github.com/fanwaave/fanwaave-flutter"
columns = ["options", "env", "type", "default", "description"]

[env]
load = false

[parse]
allow_unknown = false

[flags.api_base_url]
env = "FANWAAVE_API_BASE_URL"
aliases = ["api-base-url"]
type = "string"
help = "Public Fanwaave API base URL."

[flags.tenant_id]
env = "FANWAAVE_TENANT_ID"
aliases = ["tenant-id"]
type = "string"
help = "Fanwaave tenant identifier."
