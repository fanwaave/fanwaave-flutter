# ORES rate-limit client projection. Peer authority: ores-rate-limit/ores-rl-interfaces@241353d0f5269450690d9646be03db2aba59a2ae.
# TJSV baseline: ORESoftware/typespec-json-schema-validator@2281843126ab644607b11cf8281d84f382d68dfc.
# No server/Redis/HMAC environment references are exposed to this client repository.
schemaVersion = "ores.rate-limit.config.v1"
layout = "client-only"
defaultPolicyId = "repo-default"

[client]
root = "."
exposePolicyMetadata = true

[[policies]]
policyId = "repo-default"
clientVisible = true
algorithm = "token-bucket"
identityScope = "authenticated-subject"
capacity = 120
windowMs = 0
refillTokens = 120
refillIntervalMs = 60000
requestCost = 1
enforcementMode = "disabled"
consistencyMode = "advisory"
backendFailureMode = "fail-open"
denyCacheMode = "local-denials"
denyCacheCapacity = 256
maxOvershoot = 0
maxBlockTtlMs = 60000
keyVersion = "v1"
policyVersion = 1
