[package]
org = "fanwaave"
name = "fanwaave-flutter"
version = "0.2.0"
description = "Fanwaave Flutter audience workspace"

[package.repository]
vcs = "git"
url = "https://github.com/fanwaave/fanwaave-flutter"

[dependencies]
"oresoftware/ores-flutter" = "=0.1.0"

[install]
dir = "zed_modules"

[targets.flutter]
dir = "."
name = "fanwaave-flutter"
adapter = "dart"

[scripts]
test = "dart format --output=none --set-exit-if-changed lib test && flutter analyze --fatal-infos --fatal-warnings && flutter test --reporter expanded"
