version = 1
mode = "client"
strict = true

[flags2env]
contract = ".cli-flags.toml"
require_audit = true
precedence = "argv-over-env"

[client]
enabled = true
api_base_url_binding = "api_base_url"
tenant_id_binding = "tenant_id"
auth_token_binding = "auth_token"

[[env]]
name = "api_base_url"
key = "FANWAAVE_API_BASE_URL"
kind = "url"
required = true
secret = false
default = "https://api.fanwaave.example"

[[env]]
name = "tenant_id"
key = "FANWAAVE_TENANT_ID"
kind = "string"
required = true
secret = false

[[env]]
name = "auth_token"
key = "FANWAAVE_AUTH_TOKEN"
kind = "string"
required = true
secret = true
description = "Authentication token from the approved runtime secret boundary."
