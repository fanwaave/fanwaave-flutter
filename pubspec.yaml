name: fanwaave_flutter
description: Consent-aware audience signals, moment scoring, and observable routing.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Zed owns package resolution/integrity; Pub consumes repository-local
  # materializations without cross-org private Git credentials.
  ores_flutter:
    path: zed_modules/oresoftware/ores-flutter
  ores_otel_flutter:
    path: zed_modules/ores-otel/ores-otel-flutter
  # Keep the existing DnD edge unchanged in this PR; migrate it separately to
  # one canonical ores-dnd Flutter provider after its package path is proven.
  ores_dnd:
    git:
      url: https://github.com/ORESoftware/ores-dnd.git
      ref: 0b96c5eac6cbb210e29249ce30509c792b7e8703
      path: src/dart

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
