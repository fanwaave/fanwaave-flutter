name: fanwaave_flutter
description: Consent-aware audience signals, moment scoring, and observable routing.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Zed owns package resolution/integrity; Pub consumes repository-local
  # materializations without cross-org private Git credentials.
  ores_flutter:
    path: zed_modules/oresoftware/ores-flutter
  ores_otel_flutter:
    path: zed_modules/ores-otel/ores-otel-flutter
  ores_dnd_flutter:
    path: zed_modules/ores-dnd/ores-dnd/src/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
