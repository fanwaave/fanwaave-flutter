name: Flutter audience workspace

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/flutter.yml"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "lib/**"
      - "test/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
  pull_request:
    paths:
      - ".github/workflows/flutter.yml"
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "lib/**"
      - "test/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"

permissions:
  contents: read

concurrency:
  group: fanwaave-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FLUTTER_VERSION: 3.44.2
  ZED_CLI_SHA: f003a7421b4b293750e0d9086e5290535b1eeb89

jobs:
  analyze-test-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out immutable Zed CLI authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: tmp/zed-cli
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Build exact Zed CLI
        working-directory: tmp/zed-cli
        run: cargo build --release --locked --bin zed
      - name: Validate package manifest
        run: ./tmp/zed-cli/target/release/zed validate --manifest .zpkg.toml
      - name: Materialize exact Flutter dependencies
        run: |
          ./tmp/zed-cli/target/release/zed install --adapter dart
          echo '--- generated .zpkg.lock ---'
          cat .zpkg.lock
          test -f zed_modules/oresoftware/ores-flutter/pubspec.yaml
          test -f zed_modules/ores-otel/ores-otel-flutter/pubspec.yaml
          test -f zed_modules/ores-dnd/ores-dnd/src/dart/pubspec.yaml
          test -f zed_modules/ores-dnd/ores-dnd/src/flutter/pubspec.yaml
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify formatting without modifying the checkout
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze with warnings denied
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test first frame, routes, and compact layout
        run: flutter test --reporter expanded
      - name: Build production web output
        run: flutter build web --release
      - name: Reject credential-shaped tracked text
        shell: bash
        run: |
          if git grep -nE \
            '(ghp_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
            -- ':!pubspec.lock'; then
            echo 'credential-shaped value detected in tracked source'
            exit 1
          fi
