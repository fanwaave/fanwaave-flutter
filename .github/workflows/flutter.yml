name: Flutter audience workspace

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/flutter.yml"
      - "lib/**"
      - "test/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
  pull_request:
    paths:
      - ".github/workflows/flutter.yml"
      - "lib/**"
      - "test/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"

permissions:
  contents: read

concurrency:
  group: fanwaave-flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  analyze-test-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify formatting without modifying the checkout
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze with warnings denied
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test first frame, routes, and compact layout
        run: flutter test --reporter expanded
      - name: Build production web output
        run: flutter build web --release
      - name: Reject credential-shaped tracked text
        shell: bash
        run: |
          if git grep -nE \
            '(ghp_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
            -- ':!pubspec.lock'; then
            echo 'credential-shaped value detected in tracked source'
            exit 1
          fi
